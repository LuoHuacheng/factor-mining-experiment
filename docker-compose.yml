# 交易与量化回测系统
#
# 所有应用镜像必须由受验证的 release.env 显式提供，格式为 repository@sha256:digest。
# 运行时秘密由 RUNTIME_ENV_FILE 指向的服务器本地文件提供。

services:
  redis:
    image: redis:7-alpine
    container_name: redis
    # 纯内存模式：关闭 AOF/RDB 持久化，不落盘。
    # 慢盘曾导致 fsync/bgsave 阻塞 redis → backend redis 连接断 → 崩溃 exit 128。
    # redis 数据为行情缓存(可重建)，纯内存彻底隔离磁盘 I/O。
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
      # LAN 绑定（可选）：供其他机器推流双写；
      # 默认绑回环另一端口（无副作用），需要时设 REDIS_LAN_BIND=<本机 LAN IP>
      - "${REDIS_LAN_BIND:-127.0.0.1}:${REDIS_LAN_PORT:-6381}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - app-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  backend:
    image: "${BACKEND_IMAGE:?必须设置 BACKEND_IMAGE}"
    container_name: backend
    ports:
      - "${BACKEND_HOST_PORT:-8002}:8001"
    env_file:
      - "${RUNTIME_ENV_FILE:-.env}"
    environment:
      APP_ENV: production
      POSTGRES_HOST: "${POSTGRES_HOST:-postgres}"
      POSTGRES_PORT: "${POSTGRES_PORT:-5432}"
      POSTGRES_USER: "${POSTGRES_USER:-postgres}"
      POSTGRES_DB: "${POSTGRES_DB:-factor_lab}"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QDRANT_HOST: "${QDRANT_HOST:-qdrant}"
      QDRANT_PORT: "${QDRANT_PORT:-6333}"
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: "${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-10080}"
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: "${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}"
    # 中断重启：redis 纯内存+retry 后理论上不崩，此为偶发兜底
    restart: always
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - app-net

  frontend:
    image: "${FRONTEND_IMAGE:?必须设置 FRONTEND_IMAGE}"
    container_name: frontend
    ports:
      - "${FRONTEND_HOST_PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://backend:8001
      NEXT_PUBLIC_API_URL: ""
      NEXT_PUBLIC_WS_URL: ""
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

volumes:
  redis-data:
